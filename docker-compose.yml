services:
  # 1. PostgreSQL Database Service (Local & Server)
  db:
    image: postgres:16-alpine
    container_name: temin360-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-temin360_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temin360pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temin360_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. TEMİN 360 Web Application & API (Next.js + Prisma + PostgreSQL)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: temin360-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:temin360pass@db:5432/temin360_db?schema=public
      - API_SECRET_KEY=dta_live_8e4a90f1b2c3d4e59071f
    depends_on:
      db:
        condition: service_healthy

  # 3. TEMİN 360 Landing & Tanıtım Portalı (Port 3001)
  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    container_name: temin360-landing
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

  # 4. PocketBase Light Self-Hosted Backend Service (Port 8090)
  pocketbase:
    image: pocketbase/pocketbase:latest
    container_name: temin360-pocketbase
    restart: always
    ports:
      - "8090:8090"
    volumes:
      - pbdata:/pb/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:8090/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  pbdata:
    driver: local
