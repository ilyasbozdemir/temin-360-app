name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd apps/app-desktop
          npm pkg set version=$VERSION

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_msvs_version: "2022"

      - name: Verify ee-first
        shell: cmd
        run: |
          cd apps/app-desktop
          pnpm ls ee-first
          if exist node_modules\ee-first (
            echo FOUND
          ) else (
            echo MISSING
            exit 1
          )

      - name: Build Database Package
        run: pnpm --filter @dt/database build

      - name: Build and Package
        working-directory: apps/app-desktop
        run: pnpm build && npx electron-builder --win --x64 -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://cdn.npmmirror.com/binaries/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://cdn.npmmirror.com/binaries/electron-builder-binaries/"

      - name: Prepare Release Notes
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *"beta"* || "${{ github.ref_name }}" == *"alpha"* ]]; then
            echo "RELEASE_NAME=TEMİN 360 ${{ github.ref_name }} (Erken Erişim)" >> $GITHUB_ENV
          else
            echo "RELEASE_NAME=TEMİN 360 ${{ github.ref_name }}" >> $GITHUB_ENV
          fi
          node apps/app-desktop/scripts/generate-release-notes.js "${{ github.ref_name }}" release_notes.md

      - name: Release Files
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/app-desktop/dist-local/*.exe
            apps/app-desktop/dist-local/*.exe.blockmap
            apps/app-desktop/dist-local/*.yml
          draft: false
          prerelease: false
          name: ${{ env.RELEASE_NAME }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
